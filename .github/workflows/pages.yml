name: Deploy Neon Breaker auf GitHub Pages

on:
  push:
    branches:
      - main
      - claude/zweites-spiel-entwickeln-bcge69
    paths:
      - "neon-breaker/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Pages konfigurieren
        uses: actions/configure-pages@v5

      - name: neon-breaker/ als Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: neon-breaker

      - name: Auf GitHub Pages deployen
        id: deployment
        uses: actions/deploy-pages@v4
