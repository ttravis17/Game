<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="NEON BREAKER — Arcade-Brick-Breaker mit 12 Leveln, Power-Ups und Combos. Komplett in HTML5 Canvas, ohne Abhängigkeiten.">
  <title>NEON BREAKER</title>

  <!-- PWA: installierbar mit eigenem Icon, Vollbild, offline spielbar -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#05060e">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Neon Breaker">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game"></canvas>
  <script src="js/utils.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/particles.js"></script>
  <script src="js/levels.js"></script>
  <script src="js/entities.js"></script>
  <script src="js/game.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => { /* z.B. bei file:// — kein Problem */ });
      });
    }
  </script>
</body>
</html>
